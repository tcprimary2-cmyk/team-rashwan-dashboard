name: Apply monthly all-agent report

on:
  push:
    branches:
      - monthly-all-agent-report
    paths:
      - .github/workflows/apply-monthly-all-agent-report.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: monthly-all-agent-report
          fetch-depth: 0

      - name: Apply report patch
        run: python .github/scripts/apply_monthly_all_agent_report.py

      - name: Validate HTML JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          if '/* MONTHLY ALL-AGENT REPORT V1 */' not in html:
              raise SystemExit('Monthly report marker missing')
          if "if(period==='month')return generateMonthlyAllAgent();" not in html:
              raise SystemExit('Monthly generator routing missing')
          if 'Generate '+"'"+'+(opt?opt.label' not in html and 'Generate ' not in html:
              raise SystemExit('Dynamic report button logic missing')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', html, re.I)
          Path('/tmp/dashboard-scripts.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Patch structure validated; extracted', len(scripts), 'script blocks')
          PY
          node --check /tmp/dashboard-scripts.js

      - name: Commit patched dashboard
        run: |
          rm -f .github/scripts/apply_monthly_all_agent_report.py
          rm -f .github/workflows/apply-monthly-all-agent-report.yml
          git config user.name "ChatGPT Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add selected-month all-agent performance report [skip ci]"
          git push origin monthly-all-agent-report
