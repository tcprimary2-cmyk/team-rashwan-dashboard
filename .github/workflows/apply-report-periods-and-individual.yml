name: Apply report periods and individual report

on:
  push:
    branches: [report-periods-and-individual]
    paths:
      - '.github/workflows/apply-report-periods-and-individual.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report-periods-and-individual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/extend_reports.py
      - name: Validate structure and JavaScript syntax
        run: |
          grep -q 'MULTI-PERIOD + INDIVIDUAL REPORT V2' index.html
          grep -q 'generatePerformanceReport' index.html
          grep -q "supported=\['week','month','quarter','year'\]" index.html
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' in attrs.lower() or 'application/json' in attrs.lower():
                  continue
              blocks.append(body)
          pathlib.Path('/tmp/dashboard-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          print('inline script blocks:',len(blocks))
          PY
          node --check /tmp/dashboard-inline.js
      - name: Remove temporary patch helpers
        run: |
          rm -f .github/scripts/extend_reports.py
          rm -f .github/workflows/apply-report-periods-and-individual.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit patched dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Extend reports to week quarter year and individual [skip ci]'
          git push origin HEAD:report-periods-and-individual
