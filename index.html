</script>
<style>
:root{
  --bg:#eaedf2; --panel:#ffffff; --panel2:#f7f8fa; --line:#e4e7ec; --line2:#eef0f3;
  --txt:#161d29; --mut:#667085; --mut2:#98a2b3; --faint:#c2c8d2;
  --navy:#123a5e; --navy2:#0f3050; --gold:#c6952a; --gold2:#b5842015;
  --blue:#2f7fc4; --bronze:#b0812e; --green:#2f9e5b; --amber:#d08a20; --red:#d1544d; --purple:#7a5fd0;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 4px 16px rgba(16,24,40,.08);
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1100px 520px at 88% -8%,rgba(198,149,42,.07),transparent 60%),
  radial-gradient(900px 480px at -8% 0%,rgba(18,58,94,.06),transparent 55%),var(--bg);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 70px}

/* Header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);
  padding:14px 20px;margin-bottom:16px}
.hd-l{display:flex;align-items:center;gap:16px}
.hd-logo{display:flex;flex-direction:column;line-height:1}
.lg-p{font-size:19px;font-weight:700;letter-spacing:1.5px;color:var(--navy)}
.lg-s{font-size:8.5px;font-weight:600;letter-spacing:3.5px;color:var(--gold);margin-top:3px}
.hd-sep{width:1px;height:38px;background:var(--line)}
.hd-eyebrow{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:700}
.hd-title{font-size:20px;font-weight:600;letter-spacing:-.3px;color:var(--txt);margin-top:2px}
.hd-title b{color:var(--navy);font-weight:700}
.hd-r{display:flex;align-items:center;gap:18px}
.hd-lead{display:flex;align-items:center;gap:11px}
.hd-lead-ph{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);
  box-shadow:0 3px 10px rgba(18,58,94,.18);background:#dfe3ea}
.ll-n{font-size:13.5px;font-weight:700;color:var(--txt);line-height:1.1}
.ll-t{font-size:10px;color:var(--mut);margin-top:3px;letter-spacing:.3px}
.hd-meta{text-align:right;font-size:10.5px;color:var(--mut2);line-height:1.6;border-left:1px solid var(--line);padding-left:16px}
.hd-meta .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 7px var(--green)}
.hd-meta b{color:var(--mut);font-weight:600}

/* Controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:11px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.seg{display:inline-flex;background:#eef1f5;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s;letter-spacing:.2px}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(18,58,94,.25)}
.seg.plain button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.ctl-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mut2);margin:0 2px 0 6px;align-self:center}
.sel{background:#fff;border:1px solid var(--line);color:var(--txt);font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;min-width:155px;box-shadow:var(--sh)}
.sel:focus{outline:2px solid rgba(18,58,94,.25)}
.spacer{flex:1}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.kpi::after{content:'';position:absolute;left:0;top:0;height:3px;width:100%}
.kpi.k-calls::after{background:var(--blue)}
.kpi.k-mtg::after{background:var(--bronze)}
.kpi.k-deals::after{background:var(--green)}
.kpi.k-rev::after{background:linear-gradient(90deg,var(--gold),#e0b752)}
.kpi.k-leads::after{background:var(--purple)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.kpi-ico{font-size:15px;opacity:.9}
.kpi-val{font-size:27px;font-weight:700;letter-spacing:-.5px;margin-top:8px;line-height:1;color:var(--txt)}
.kpi-sub{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--mut2);flex-wrap:wrap}
.delta{font-weight:700;padding:1px 7px;border-radius:20px;font-size:10.5px}
.delta.up{color:var(--green);background:rgba(47,158,91,.12)}
.delta.dn{color:var(--red);background:rgba(209,84,77,.12)}
.delta.flat{color:var(--mut);background:rgba(16,24,40,.05)}
.tgt{font-size:10px;color:var(--mut2)}
.tgt b{color:var(--txt)}
.tprog{height:5px;border-radius:5px;background:#eef1f5;margin-top:10px;overflow:hidden}
.tprog span{display:block;height:100%;border-radius:5px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.k-calls .tprog span{background:var(--blue)}
.k-mtg .tprog span{background:var(--bronze)}
.k-deals .tprog span{background:var(--green)}
.k-rev .tprog span{background:linear-gradient(90deg,var(--gold),#e0b752)}
.k-leads .tprog span{background:var(--purple)}

/* Panels */
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--sh)}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-t{font-size:13px;font-weight:700;letter-spacing:.2px;color:var(--txt)}
.panel-t small{display:block;font-size:10px;color:var(--mut2);font-weight:500;letter-spacing:.3px;margin-top:2px}
.mini-seg{display:inline-flex;gap:2px;background:#eef1f5;border:1px solid var(--line);border-radius:8px;padding:2px}
.mini-seg button{border:0;background:transparent;color:var(--mut);font-family:var(--sans);font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer}
.mini-seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.chart-box{position:relative;height:280px}

/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;transition:.15s;cursor:pointer}
.row:hover{border-color:#d3d8e0;background:#fff;box-shadow:var(--sh)}
.row.r1{border-color:rgba(198,149,42,.55);background:linear-gradient(90deg,rgba(198,149,42,.07),var(--panel2))}
.row.r2{border-color:rgba(140,150,165,.4)}
.row.r3{border-color:rgba(176,129,46,.35)}
.badge{width:26px;min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#e7eaef;color:#8a94a6}
.r1 .badge{background:linear-gradient(135deg,#e6b53f,#b5842a);color:#fff}
.r2 .badge{background:linear-gradient(135deg,#c7ccd4,#9aa2af);color:#fff}
.r3 .badge{background:linear-gradient(135deg,#d79a5c,#a86a34);color:#fff}
.av{width:38px;min-width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #e0e4ea;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#dfe3ea}
.r1 .av{border-color:var(--gold)}
.who{flex:1;min-width:0}
.who .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.who .ro{font-size:10px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.inactive .nm{color:var(--mut)}
.tag-off{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle;background:#eef1f5}
.rstats{display:flex;gap:0;flex-shrink:0}
.rs{text-align:right;padding-left:16px;min-width:52px}
.rs .v{font-size:13px;font-weight:700;color:var(--txt)}
.rs .l{font-size:8px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut2);margin-top:1px}
.rs.rev .v{color:var(--gold)}
.rs.deals .v{color:var(--green)}
.open-hint{font-size:9px;color:var(--mut2);margin-left:8px;opacity:0;transition:.15s}
.row:hover .open-hint{opacity:1}
@media(max-width:640px){.rs.hideM{display:none}}

/* Individual */
.ind-hd{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 18px;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.ind-hd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--navy))}
.ind-av{width:66px;min-width:66px;height:66px;border-radius:16px;object-fit:cover;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:#dfe3ea}
.ind-meta .nm{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.ind-meta .ro{font-size:12px;color:var(--navy);font-weight:600;margin-top:2px}
.ind-meta .st{font-size:11px;color:var(--mut);margin-top:6px}
.ind-meta .st b{color:var(--txt)}
.pill{display:inline-block;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:8px}
.pill.on{background:rgba(47,158,91,.13);color:var(--green)}
.pill.off{background:rgba(209,84,77,.12);color:var(--red)}
.ind-pipe{margin-left:auto;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 18px;flex-shrink:0}
.ind-pipe .pv{font-size:24px;font-weight:700;color:var(--purple);line-height:1}
.ind-pipe .pl{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut2);margin-top:4px}
.back-lnk{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--navy);font-weight:600;cursor:pointer;margin-bottom:10px}
.back-lnk:hover{text-decoration:underline}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mut2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);color:var(--txt)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .rev{color:var(--gold);font-weight:700}
.tbl .pend{color:var(--amber);font-size:11px}
.tbl-name{display:flex;align-items:center;gap:8px}
.tbl-name .av{width:28px;min-width:28px;height:28px;font-size:11px;border-width:1.5px}

/* Compare chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 7px;background:var(--panel);border:1px solid var(--line);border-radius:30px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut);transition:.15s;user-select:none;box-shadow:var(--sh)}
.chip:hover{border-color:#c9cfd8;color:var(--txt)}
.chip.sel{border-color:var(--navy);color:var(--txt);background:#f2f6fb}
.chip .av{width:24px;min-width:24px;height:24px;font-size:10px;border-width:1.5px}
.chip .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.chip.sel .ck{background:var(--navy);border-color:var(--navy);color:#fff}

.note{font-size:11px;color:var(--mut);line-height:1.6;background:#fbf7ee;border:1px solid #eadfc6;border-radius:12px;padding:11px 13px;margin-top:14px}
.note b{color:var(--gold)}
.empty{text-align:center;padding:40px 20px;color:var(--mut2);font-size:13px}
.hidden{display:none!important}
.footer{text-align:center;font-size:10px;color:var(--faint);margin-top:24px;letter-spacing:.4px}

@media(max-width:860px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.hd-meta{display:none}.hd-title{font-size:18px}.kpi-val{font-size:23px}.ind-pipe{display:none}}
</style>
</head>

function parseCSV(csv){
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<csv.length;i++){
    const ch=csv[i], next=csv[i+1];
    if(ch==='"'){
      if(quoted && next==='"'){cell+='"';i++;}
      else quoted=!quoted;
    }else if(ch===',' && !quoted){
      row.push(cell); cell='';
    }else if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r'&&next==='\n')i++;
      row.push(cell); cell='';
      if(row.some(v=>String(v).trim()!==''))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  row.push(cell);
  if(row.some(v=>String(v).trim()!==''))rows.push(row);
  return rows;
}
function cleanHeader(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');}
function col(headers,name){return headers.map(cleanHeader).indexOf(cleanHeader(name));}
function num(v){
  const n=Number(String(v??'').replace(/[^0-9.-]/g,''));
  return Number.isFinite(n)?n:0;
}
function sheetDate(v){
  const s=String(v||'').trim();
  if(!s)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;

  // Handles entries such as "August 1" from the KPI sheet.
  let dt=new Date(`${s}, 2026 00:00:00 UTC`);
  if(Number.isNaN(dt.getTime()))dt=new Date(s);
  return Number.isNaN(dt.getTime())?null:dt.toISOString().slice(0,10);
}
async function connectGoogleSheet(){
  try{
    const separator=GOOGLE_APPS_SCRIPT_URL.includes('?')?'&':'?';
    const response=await fetch(
      GOOGLE_APPS_SCRIPT_URL+separator+'_='+Date.now(),
      {cache:'no-store'}
    );
    if(!response.ok)throw new Error(`HTTP ${response.status}`);

    const payload=await response.json();
    if(payload && payload.error)throw new Error(payload.error);
    if(!Array.isArray(payload) || !payload.length)
      throw new Error('No KPI rows were returned by Apps Script.');

    const sheetDaily=[], sheetDeals=[];

    for(const row of payload){
      const d=sheetDate(row['Date']);
      const n=String(row['Broker']||'').trim();
      if(!d || !n)continue;

      sheetDaily.push({
        d,
        n,
        c:num(row['Total Calls']),
        m:num(row['Meetings']),
        k:0,
        l:num(row['Active Leads'])
      });

      const count=Math.max(0,Math.round(num(row['Closed Deal'])));
      const revenue=Math.max(0,num(row['AED Revenue']));

      if(count>0){
        for(let x=0;x<count;x++){
          sheetDeals.push({
            date:d,
            name:n,
            aed:revenue/count,
            confirmed:true
          });
        }
      }else if(revenue>0){
        sheetDeals.push({
          date:d,
          name:n,
          aed:revenue,
          confirmed:true
        });
      }
    }

    if(!sheetDaily.length)
      throw new Error('No valid Date/Broker rows were found.');

    // Google Sheets replaces matching agent/date records while the original
    // dashboard retains older historical records not present in the sheet.
    const dailyKeys=new Set(
      sheetDaily.map(r=>`${r.d}|${r.n.toLowerCase()}`)
    );

    DAILY=DAILY
      .filter(r=>!dailyKeys.has(`${r.d}|${r.n.toLowerCase()}`))
      .concat(sheetDaily);

    const firstSheetDate=sheetDaily.map(r=>r.d).sort()[0];
    DEALS=DEALS.filter(d=>d.date<firstSheetDate).concat(sheetDeals);

    const rosterNames=new Set(ROSTER.map(r=>r.name.toLowerCase()));
    [...new Set(sheetDaily.map(r=>r.n))].forEach(name=>{
      if(!rosterNames.has(name.toLowerCase())){
        ROSTER.push({name,active:true,lastActive:'Current'});
        rosterNames.add(name.toLowerCase());
      }
    });

    DAILY.sort((a,b)=>a.d.localeCompare(b.d)||a.n.localeCompare(b.n));
    DEALS.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));

    const latest=[
      ...DAILY.map(r=>r.d),
      ...DEALS.map(r=>r.date)
    ].sort().pop();

    if(latest)CFG.lastDataDate=latest;

    console.info(
      `Google Apps Script connected: ${sheetDaily.length} KPI rows loaded.`
    );
  }catch(error){
    console.error(
      'Google Apps Script connection failed. Embedded data is being shown.',
      error
    );

    const warning=document.createElement('div');
    warning.style.cssText=
      'position:fixed;left:12px;bottom:12px;z-index:9999;' +
      'background:#fff3cd;color:#664d03;border:1px solid #ffecb5;' +
      'padding:9px 12px;border-radius:8px;font:12px Arial;' +
      'box-shadow:0 4px 16px rgba(0,0,0,.15)';

    warning.textContent=
      'Google Sheet could not be loaded. Showing saved dashboard data.';

    document.body.appendChild(warning);
  }
}

      out.push({key:d,label:MON[dt.getUTCMonth()]+' '+dt.getUTCDate()+', 2026'});
    });
  }else if(period==='month'){
    Object.keys(KEYMONTH).sort().forEach(k=>out.push({key:k,label:KEYMONTH[k]}));
  }else if(period==='week'){
    let w=mondayOf(MIND);
    while(w<=MAXD){
      const end=addDays(w,6);
      const key='W'+fmtD(w);
      const lbl='Wk '+MON[w.getUTCMonth()]+' '+w.getUTCDate()+'–'+(end.getUTCMonth()!==w.getUTCMonth()?MON[end.getUTCMonth()]+' ':'')+end.getUTCDate();
      out.push({key,label:lbl,start:fmtD(w),end:fmtD(end)});
      w=addDays(w,7);
    }
  }else if(period==='quarter'){
    out.push({key:'2026-Q2',label:'Q2 2026 · Apr–Jun'});
    out.push({key:'2026-Q3',label:'Q3 2026 · Jul–Sep'});
  }else{ out.push({key:'2026',label:'Full Year 2026'}); }
  return out;
}
function rangeOf(period,key){
  if(period==='day'){return{start:key,end:key};}
  if(period==='month'){const[y,m]=key.split('-').map(Number);return{start:`${key}-01`,end:fmtD(new Date(Date.UTC(y,m,0)))};}
  if(period==='week'){const s=key.slice(1);return{start:s,end:fmtD(addDays(parseD(s),6))};}
  if(period==='quarter'){return key==='2026-Q2'?{start:'2026-04-01',end:'2026-06-30'}:{start:'2026-07-01',end:'2026-09-30'};}
  return {start:'2026-01-01',end:'2026-12-31'};
}
function prevKey(period,key){
  const opts=buildPeriods(period);const i=opts.findIndex(o=>o.key===key);
  return i>0?opts[i-1].key:null;
}
function monthsInRange(range){
  return Object.keys(KEYMONTH).filter(k=>{const r=rangeOf('month',k);return r.start<=range.end && r.end>=range.start;});
}

/* ══════════════════════ AGGREGATION ══════════════════════ */
function inRange(d,r){return d>=r.start && d<=r.end;}
function aggregate(range,name){
  let calls=0,mtg=0,leads=0;
  for(const row of DAILY){ if(name&&row.n!==name)continue; if(!inRange(row.d,range))continue; calls+=row.c;mtg+=row.m;leads+=row.l; }
  let deals=0,rev=0,pending=0;
  for(const d of DEALS){ if(name&&d.name!==name)continue; if(!inRange(d.date,range))continue; deals++; if(d.aed)rev+=d.aed; else pending++; }
  return {calls,mtg,deals,rev,pending,leads};
}
function latestLeads(name,range){
  const rows=DAILY.filter(r=>r.n===name && inRange(r.d,range));
  if(!rows.length){const all=DAILY.filter(r=>r.n===name).sort((a,b)=>a.d<b.d?1:-1);return all.length?all[0].l:null;}
  rows.sort((a,b)=>a.d<b.d?1:-1);return rows[0].l;
}
function teamLatestLeads(range){
  return activeAgents(range).reduce((s,n)=>s+(latestLeads(n,range)||0),0);
}
/* which agents have any activity in range */
function activeAgents(range){
  const s=new Set();
  DAILY.forEach(r=>{if(inRange(r.d,range))s.add(r.n);});
  DEALS.forEach(d=>{if(inRange(d.date,range))s.add(d.name);});
  return [...s];
}
/* per-agent active months within a range (for target scaling) */
function agentActiveMonths(name,range){
  return monthsInRange(range).filter(mk=>{
    const mr=rangeOf('month',mk);
    return DAILY.some(r=>r.n===name && inRange(r.d,mr));
  }).length;
}
/* target factor (in months) for an agent over the selected period */
function targetFactor(name,period,range){
  if(period==='day'){
    const act=DAILY.some(r=>r.n===name && r.d===range.start);
    return act?1/DAYS_IN_MONTH:0;
  }
  if(period==='week'){ // active that week's month?
    const mk=monthsInRange(range)[0];
    const act=DAILY.some(r=>r.n===name && inRange(r.d,rangeOf('month',mk)));
    return act?7/DAYS_IN_MONTH:0;
  }
  if(period==='month'){const act=DAILY.some(r=>r.n===name && inRange(r.d,range));return act?1:0;}
  return agentActiveMonths(name,range); // quarter/year
}
function teamTargetFactor(period,range){
  return activeAgents(range).reduce((s,n)=>s+targetFactor(n,period,range),0);
}

/* ══════════════════════ FORMAT ══════════════════════ */
function fAED(v){if(v==null)return '—';if(v>=1e6)return 'AED '+(v/1e6).toFixed(2)+'M';if(v>=1e3)return 'AED '+Math.round(v/1e3)+'K';return 'AED '+v.toLocaleString();}
function fShort(v){if(v>=1e6)return (v/1e6).toFixed(2)+'M';if(v>=1e3)return Math.round(v/1e3)+'K';return ''+v;}
function fNum(v){return Math.round(v).toLocaleString();}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function deltaHTML(cur,prev){
  if(prev==null)return '<span class="tgt">no prior period</span>';
  if(prev===0&&cur===0)return '<span class="delta flat">±0%</span>';
  if(prev===0)return '<span class="delta up">▲ new</span>';
  const d=Math.round((cur-prev)/prev*100);
  const cls=d>0?'up':d<0?'dn':'flat';const ar=d>0?'▲':d<0?'▼':'±';
  return `<span class="delta ${cls}">${ar} ${Math.abs(d)}%</span>`;
}

function baseOpts(extra){return Object.assign({responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{boxWidth:10,boxHeight:10,font:{size:11},usePointStyle:true,pointStyle:'circle'}}},
  scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:C.grid},ticks:{font:{size:10}},beginAtZero:true}}},extra||{});}

/* ══════════════════════ RENDER: shared period totals over months ══════════════════════ */
function monthlySeries(name){ // returns {labels, calls[], mtg[], deals[], rev[]}
  const labels=[],calls=[],mtg=[],deals=[],rev=[];
  Object.keys(KEYMONTH).forEach(mk=>{
    const r=rangeOf('month',mk);const a=aggregate(r,name);
    labels.push(KEYMONTH[mk]);calls.push(a.calls);mtg.push(a.mtg);deals.push(a.deals);rev.push(a.rev);
  });
  return {labels,calls,mtg,deals,rev};
}

function kpiTile(cls,ico,lbl,val,cur,prev,target,pending){

  if(target){const p=pct(cur,target);prog=`<div class="tprog"><span style="width:${Math.min(100,p)}%"></span></div>`;}
  return `<div class="kpi k-${cls}"><div class="kpi-top"><span class="kpi-lbl">${lbl}</span><span class="kpi-ico">${ico}</span></div>
    <div class="kpi-val">${val}${pending?`<span style="font-size:12px;color:var(--amber)"> +${pending}?</span>`:''}</div>
    <div class="kpi-sub">${sub}</div>${prog}</div>`;
}

function refreshPeriodPicker(){
  const opts=buildPeriods(state.period);
  const def=opts[opts.length-1].key; // latest
  if(!state.periodKey||!opts.find(o=>o.key===state.periodKey))state.periodKey=def;
  const sel=document.getElementById('period-pick');
  sel.innerHTML=opts.map(o=>`<option value="${o.key}" ${o.key===state.periodKey?'selected':''}>${o.label}</option>`).join('');
}
function refreshAgentPicker(){
  const sel=document.getElementById('agent-pick');
  sel.classList.toggle('hidden',state.view!=='individual');
  if(state.view!=='individual')return;
  if(!state.agent)state.agent=AGENT_NAMES[0];
  const active=ROSTER.filter(r=>r.active).map(r=>r.name);
  const former=ROSTER.filter(r=>!r.active).map(r=>r.name);
  sel.innerHTML=`<optgroup label="Active">${active.map(n=>`<option ${n===state.agent?'selected':''}>${n}</option>`).join('')}</optgroup>`+
    (former.length?`<optgroup label="Former">${former.map(n=>`<option ${n===state.agent?'selected':''}>${n}</option>`).join('')}</optgroup>`:'');
}
function updateRangeLabel(){
  const r=rangeOf(state.period,state.periodKey);
  const s=new Date(r.start),e=new Date(r.end);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  document.getElementById('hd-range').textContent=f(s)+' – '+f(e)+' 2026';
}
function render(){
  updateRangeLabel();
  if(state.view==='team')renderTeam();
  else if(state.view==='individual')renderIndividual();
  else renderCompare();
}
function setView(v){
  state.view=v;
  document.querySelectorAll('#view-seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  refreshAgentPicker();
  render();
}
document.getElementById('view-seg').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view);};
document.getElementById('period-seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  state.period=b.dataset.p;document.querySelectorAll('#period-seg button').forEach(x=>x.classList.toggle('on',x.dataset.p===state.period));
  refreshPeriodPicker();render();};
document.getElementById('period-pick').onchange=e=>{state.periodKey=e.target.value;render();};
document.getElementById('agent-pick').onchange=e=>{state.agent=e.target.value;render();};

/* ══════════════════════ LIVE AIRTABLE PHOTOS ══════════════════════ */
const AT_TOOL='mcp__5a48164a-972f-494f-832a-c5cc77759b6b__list_records_for_table';
async function loadPhotos(){
  try{
    if(!(window.cowork&&window.cowork.callMcpTool))return;
    const a=CFG.airtable;
    const raw=await window.cowork.callMcpTool(AT_TOOL,{baseId:a.baseId,tableId:a.agentsTable,fieldIds:[a.fName,a.fPhoto,a.fRole]});
    let data=raw; if(typeof raw==='string')data=JSON.parse(raw);
    else if(raw&&raw.content&&raw.content[0]&&raw.content[0].text)data=JSON.parse(raw.content[0].text);
    else if(raw&&raw.structuredContent)data=raw.structuredContent;
    const recs=(data&&data.records)||[];
    if(!recs.length)return;
    recs.forEach(r=>{
      const nm=(r.fields[a.fName]||'').trim();if(!nm)return;
      // match case-insensitively to a known roster name
      const key=AGENT_NAMES.find(n=>n.toLowerCase()===nm.toLowerCase())||nm;
      if(!AGENT_META[key])AGENT_META[key]={};
      const ph=r.fields[a.fPhoto];AGENT_META[key].photo=(ph&&ph[0]&&ph[0].url)||AGENT_META[key].photo;
      if(r.fields[a.fRole])AGENT_META[key].role=r.fields[a.fRole];
    });
    render(); // re-render with photos
  }catch(err){/* silent: keep initials */}
}

/* ══════════════════════ INIT ══════════════════════ */
document.getElementById('hd-updated').textContent='Data to '+new Date(CFG.lastDataDate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
if(RASHWAN_PHOTO)document.getElementById('hd-lead-photo').src=RASHWAN_PHOTO;
state.period='month';
const availableMonths=buildPeriods('month');
state.periodKey=availableMonths.length?availableMonths[availableMonths.length-1].key:null;
refreshPeriodPicker();refreshAgentPicker();render();
loadPhotos();
})();
</script>

<script>
/* ══════════════════════ REPORT GENERATOR ══════════════════════ */
(function(){
  const css = `
  #rep-btn{background:var(--navy,#123a5e);color:#fff;border:0;font-family:var(--sans);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  #rep-btn:hover{filter:brightness(1.1)}
  .rep-wrap{position:relative}
  .rep-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e4e7ec;border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.2);padding:6px;z-index:120;min-width:158px}
  .rep-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:var(--sans);font-size:13px;font-weight:600;color:#161d29;padding:9px 12px;border-radius:8px;cursor:pointer}
  .rep-menu button:hover{background:#f2f4f7}
  #rep-overlay{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:300;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:26px 16px}
  #rep-overlay.show{display:flex}
  .rep-paper{background:#fff;color:#1a2230;width:100%;max-width:830px;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden;font-family:var(--sans)}
  .rep-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:#0f2f50;color:#fff}
  .rep-bar .t{font-size:13px;font-weight:600;letter-spacing:.3px}
  .rep-bar .btns{display:flex;gap:8px}
  .rep-bar button{border:0;border-radius:8px;padding:7px 13px;font-family:var(--sans);font-weight:600;font-size:12.5px;cursor:pointer}
  .rep-print{background:#c6952a;color:#1a1400}
  .rep-close{background:rgba(255,255,255,.16);color:#fff}
  .rep-body{padding:26px 30px 34px}
  .rep-hh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #123a5e;padding-bottom:14px;margin-bottom:16px}
  .rep-brand .p{font-size:20px;font-weight:700;letter-spacing:1.5px;color:#123a5e}
  .rep-brand .s{font-size:8.5px;font-weight:600;letter-spacing:3.5px;color:#c6952a;margin-top:2px}
  .rep-meta{text-align:right;font-size:11px;color:#667085;line-height:1.6}
  .rep-title{font-size:23px;font-weight:700;color:#101828;margin:2px 0}
  .rep-sub{font-size:12.5px;color:#667085;margin-bottom:20px}
  .rep-kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
  .rep-k{border:1px solid #e4e7ec;border-radius:12px;padding:13px 14px}
  .rep-k .l{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#667085;font-weight:600}
  .rep-k .v{font-size:21px;font-weight:700;color:#101828;margin-top:6px;line-height:1.05}
  .rep-k .d{font-size:10.5px;margin-top:6px;color:#98a2b3}
  .rep-k .d b.up{color:#2f9e5b}.rep-k .d b.dn{color:#d1544d}
  .rep-h{font-size:13px;font-weight:700;color:#123a5e;margin:24px 0 10px;letter-spacing:.3px}
  .rep-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .rep-tbl th{text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#98a2b3;font-weight:600;padding:8px 10px;border-bottom:1px solid #e4e7ec}
  .rep-tbl td{padding:8px 10px;border-bottom:1px solid #eef0f3}
  .rep-tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
  .rep-tbl td.rev{color:#b5842a;font-weight:700}
  .rep-tbl tr.top td{background:#faf6ec}
  .rep-foot{margin-top:24px;padding-top:12px;border-top:1px solid #e4e7ec;font-size:10px;color:#98a2b3;text-align:center;letter-spacing:.4px}
  @media print{
    body>*{display:none!important}
    #rep-overlay{display:block!important;position:static!important;background:#fff!important;padding:0!important;overflow:visible}
    #rep-overlay .rep-bar{display:none!important}
    .rep-paper{box-shadow:none!important;max-width:100%!important;border-radius:0!important}
    @page{margin:13mm}
  }`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  function fFull(v){return v==null?'—':'AED '+Math.round(v).toLocaleString('en-US');}
  function num(v){return Math.round(v).toLocaleString('en-US');}
  const PLBL={day:'Daily',week:'Weekly',month:'Monthly',quarter:'Quarterly',year:'Yearly'};

  function latestOpt(period){
    const opts=buildPeriods(period);
    for(let i=opts.length-1;i>=0;i--){const a=aggregate(rangeOf(period,opts[i].key));if(a.calls||a.mtg||a.deals)return opts[i];}
    return opts[opts.length-1];
  }
  function repDelta(cur,prev){
    if(prev==null)return '';
    if(prev===0&&cur===0)return ' · <b>±0%</b>';
    if(prev===0)return ' · <b class="up">▲ new</b>';
    const d=Math.round((cur-prev)/prev*100);
    return ' · <b class="'+(d>0?'up':d<0?'dn':'')+'">'+(d>0?'▲':d<0?'▼':'±')+Math.abs(d)+'% vs prev</b>';
  }
  function generate(period){
    const opt=latestOpt(period);const key=opt.key;const range=rangeOf(period,key);
    const agg=aggregate(range);
    const pk=prevKey(period,key);const prev=pk?aggregate(rangeOf(period,pk)):null;
    const tf=teamTargetFactor(period,range);
    const tCalls=Math.round(T.callsPerMonth*tf),tMtg=Math.round(T.meetingsPerMonth*tf),tRev=Math.round(T.revenuePerMonth*tf);
    const rows=activeAgents(range).map(n=>({name:n,...aggregate(range,n)})).sort((a,b)=>b.rev-a.rev||b.deals-a.deals);
    const dealsList=DEALS.filter(d=>inRange(d.date,range)).sort((a,b)=>a.date<b.date?1:-1);
    const now=new Date();
    const fdate=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const body=`
      <div class="rep-hh">
        <div class="rep-brand"><div class="p">PROVIDENT</div><div class="s">REAL ESTATE</div></div>
        <div class="rep-meta">Team Rashwan · Command Report<br>Generated ${now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}<br>Confidential — Internal Use Only</div>
      </div>
      <div class="rep-title">${PLBL[period]} Performance Report</div>
      <div class="rep-sub">${opt.label} &nbsp;·&nbsp; ${fdate(range.start)} – ${fdate(range.end)}</div>
      <div class="rep-kgrid">
        <div class="rep-k"><div class="l">Calls Made</div><div class="v">${num(agg.calls)}</div><div class="d">of ${num(tCalls)} target${repDelta(agg.calls,prev&&prev.calls)}</div></div>
        <div class="rep-k"><div class="l">Meetings</div><div class="v">${num(agg.mtg)}</div><div class="d">of ${num(tMtg)} target${repDelta(agg.mtg,prev&&prev.mtg)}</div></div>
        <div class="rep-k"><div class="l">Deals Closed</div><div class="v">${agg.deals}</div><div class="d">${agg.pending?agg.pending+' value pending':'all confirmed'}${repDelta(agg.deals,prev&&prev.deals)}</div></div>
        <div class="rep-k"><div class="l">Revenue</div><div class="v" style="color:#b5842a">${fFull(agg.rev)}</div><div class="d">of ${fFull(tRev)} target${repDelta(agg.rev,prev&&prev.rev)}</div></div>
      </div>
      <div class="rep-h">Agent Leaderboard — ${opt.label}</div>
      <table class="rep-tbl"><thead><tr><th>#</th><th>Agent</th><th class="n">Calls</th><th class="n">Meetings</th><th class="n">Deals</th><th class="n">Revenue (AED)</th></tr></thead><tbody>
      ${rows.length?rows.map((a,i)=>`<tr class="${i===0?'top':''}"><td>${i+1}</td><td>${a.name}</td><td class="n">${num(a.calls)}</td><td class="n">${num(a.mtg)}</td><td class="n">${a.deals}</td><td class="n rev">${a.rev?num(a.rev):'—'}</td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:#98a2b3;padding:16px">No activity in this period.</td></tr>'}
      <tr style="font-weight:700;background:#eef2f6"><td></td><td>TEAM TOTAL</td><td class="n">${num(agg.calls)}</td><td class="n">${num(agg.mtg)}</td><td class="n">${agg.deals}</td><td class="n rev">${num(agg.rev)}</td></tr>
      </tbody></table>
      <div class="rep-h">Deals Closed — ${dealsList.length} deal${dealsList.length===1?'':'s'}</div>
      <table class="rep-tbl"><thead><tr><th>Date</th><th>Agent</th><th class="n">Value (AED)</th></tr></thead><tbody>
      ${dealsList.length?dealsList.map(d=>`<tr><td>${fdate(d.date)}${d.approxDate?' *':''}</td><td>${d.name}</td><td class="n rev">${d.aed?num(d.aed):'value pending'}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;color:#98a2b3;padding:16px">No deals closed in this period.</td></tr>'}
      </tbody></table>
      <div class="rep-foot">Team Rashwan Command Dashboard · Provident Real Estate · Figures from the daily KPI tracker &amp; deal ledger · Confidential — Internal Use Only</div>`;
    let ov=document.getElementById('rep-overlay');
    if(!ov){ov=document.createElement('div');ov.id='rep-overlay';document.body.appendChild(ov);ov.onclick=e=>{if(e.target===ov)ov.classList.remove('show');};}
    ov.innerHTML=`<div class="rep-paper"><div class="rep-bar"><div class="t">${PLBL[period]} Report · ${opt.label}</div><div class="btns"><button class="rep-print" onclick="window.print()">🖨 Print / Save as PDF</button><button class="rep-close" onclick="document.getElementById('rep-overlay').classList.remove('show')">✕ Close</button></div></div><div class="rep-body">${body}</div></div>`;
    ov.classList.add('show');ov.scrollTop=0;
  }
  const btn=document.getElementById('rep-btn'),menu=document.getElementById('rep-menu');
  if(btn){
    btn.onclick=e=>{e.stopPropagation();menu.classList.toggle('hidden');};
    menu.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();menu.classList.add('hidden');generate(b.dataset.rp);});
    document.addEventListener('click',()=>menu.classList.add('hidden'));
  }
})();
</script>
